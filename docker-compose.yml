services:
  transcriber:
    build: .
    platform: linux/amd64
    ports:
      - "${TRANSLATOR_PORT:-8765}:${TRANSLATOR_PORT:-8765}"
    environment:
      - TRANSLATOR_HOST=0.0.0.0
      - TRANSLATOR_PORT=${TRANSLATOR_PORT:-8765}
      - TRANSLATOR_MODEL=${TRANSLATOR_MODEL:-small}
      - TRANSLATOR_DEVICE=${TRANSLATOR_DEVICE:?Set TRANSLATOR_DEVICE to an ALSA input name}
      - TRANSLATOR_LANGUAGE=${TRANSLATOR_LANGUAGE:-es}
    volumes:
      - ./transcripts:/app/transcripts
    devices:
      - /dev/snd:/dev/snd
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
