name: Required

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.validated_candidate.outputs.sha }}
      python: ${{ steps.classify.outputs.python }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docker: ${{ steps.classify.outputs.docker }}
      workflow_lint: ${{ steps.classify.outputs.workflow_lint }}
      python_requirement: ${{ steps.classify.outputs.python_requirement }}
      dependency_audit: ${{ steps.classify.outputs.dependency_audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pull_request_target does not populate merge_commit_sha.
      # Resolve GitHub's base-repository merge ref, then pin the checked-out
      # commit only after its event base/head parents have been validated.
      - name: Resolve the base repository merge ref
        id: candidate_input
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python policy/scripts/ci_merge_candidate.py prepare
          "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.candidate_input.outputs.merge_ref }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the candidate is the current synthetic merge
        id: validated_candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python policy/scripts/ci_merge_candidate.py validate candidate
          "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Reject candidate-controlled pull request workflows
        run: >-
          python policy/scripts/validate_workflow_triggers.py
          candidate/.github/workflows

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ steps.validated_candidate.outputs.sha }}
        run: |
          set -o pipefail
          git -C candidate diff --no-renames --name-only -z \
            "$BASE_SHA" "$CANDIDATE_SHA" \
            | python policy/scripts/ci_path_classifier.py >> "$GITHUB_OUTPUT"

  python_test:
    if: needs.classify.outputs.python == 'true'
    needs: classify
    uses: ./.github/workflows/pytest.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  python_lint:
    if: needs.classify.outputs.python == 'true'
    needs: classify
    uses: ./.github/workflows/pylint.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  frontend:
    if: needs.classify.outputs.frontend == 'true'
    needs: classify
    uses: ./.github/workflows/frontend.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  docker:
    if: needs.classify.outputs.docker == 'true'
    needs: classify
    uses: ./.github/workflows/docker.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  workflow_lint:
    if: needs.classify.outputs.workflow_lint == 'true'
    needs: classify
    uses: ./.github/workflows/actionlint.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  python_requirement:
    if: needs.classify.outputs.python_requirement == 'true'
    needs: classify
    uses: ./.github/workflows/python-requirement.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  dependency_audit:
    if: needs.classify.outputs.dependency_audit == 'true'
    needs: classify
    uses: ./.github/workflows/dependency-audit.yml
    with:
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}

  required:
    # This native job name is the ruleset's required GitHub Actions context.
    # Keeping the decision in the base-owned workflow associates it with the
    # pull request while preventing candidate code from minting the result.
    name: required
    if: always()
    needs:
      - classify
      - python_test
      - python_lint
      - frontend
      - docker
      - workflow_lint
      - python_requirement
      - dependency_audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      PYTHON_REQUIRED: ${{ needs.classify.outputs.python }}
      PYTHON_TEST_RESULT: ${{ needs.python_test.result }}
      PYTHON_LINT_RESULT: ${{ needs.python_lint.result }}
      FRONTEND_REQUIRED: ${{ needs.classify.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCKER_REQUIRED: ${{ needs.classify.outputs.docker }}
      DOCKER_RESULT: ${{ needs.docker.result }}
      WORKFLOW_LINT_REQUIRED: ${{ needs.classify.outputs.workflow_lint }}
      WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
      PYTHON_REQUIREMENT_REQUIRED: ${{ needs.classify.outputs.python_requirement }}
      PYTHON_REQUIREMENT_RESULT: ${{ needs.python_requirement.result }}
      DEPENDENCY_AUDIT_REQUIRED: ${{ needs.classify.outputs.dependency_audit }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency_audit.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - name: Enforce applicable suite results
        run: python policy/scripts/ci_result_gate.py
