name: Pytest

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.candidate_sha || github.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
        restore-cache: false
        save-cache: false
    - name: Install dependencies
      # Runtime tests exercise real HTTP/audio processing with fake hardware and
      # backends. These groups exclude Torch, Whisper, and PortAudio.
      run: uv sync --locked --only-group dev --only-group app-test
    - name: Run tests
      # test_chunking and test_backend_benchmark each load a Whisper model
      # (~500MB download, CPU inference). Those run locally, not per-PR.
      run: |
        uv run --only-group dev --only-group app-test pytest tests -q \
          --ignore=tests/test_chunking.py \
          --ignore=tests/test_backend_benchmark.py \
          --ignore=tests/test_argos_stanza_compatibility.py
