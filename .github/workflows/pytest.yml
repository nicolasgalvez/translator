name: Pytest

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      # --extra cpu keeps torch off the CUDA index; the default wheel would drag
      # a CUDA runtime a test job has no use for.
      run: uv sync --locked --group dev --extra cpu
    - name: Run tests
      # test_chunking and test_backend_benchmark each load a Whisper model
      # (~500MB download, CPU inference). Those run locally, not per-PR.
      run: |
        uv run pytest tests -q \
          --ignore=tests/test_chunking.py \
          --ignore=tests/test_backend_benchmark.py
