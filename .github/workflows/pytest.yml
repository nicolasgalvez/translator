name: Pytest

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      # --only-group dev: the tests that run here import stdlib plus the repo's
      # own modules and nothing else. Syncing the project's runtime tree would
      # download torch to run tests that never touch it — measured at 60s
      # against 1.8s for the dev group alone.
      run: uv sync --locked --only-group dev
    - name: Run tests
      # test_chunking and test_backend_benchmark each load a Whisper model
      # (~500MB download, CPU inference). Those run locally, not per-PR.
      run: |
        uv run --only-group dev pytest tests -q \
          --ignore=tests/test_chunking.py \
          --ignore=tests/test_backend_benchmark.py
