name: CI

# Thin orchestrator: every check lives in its own reusable workflow so it can be
# run, edited, or required independently. Add a check by adding a workflow file
# and one `uses:` line here.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-syntax:
    uses: ./.github/workflows/actionlint.yml
    with:
      candidate_sha: ${{ github.sha }}
  lint:
    uses: ./.github/workflows/pylint.yml
    with:
      candidate_sha: ${{ github.sha }}
  test:
    uses: ./.github/workflows/pytest.yml
    with:
      candidate_sha: ${{ github.sha }}
