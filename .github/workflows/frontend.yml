name: Frontend

# Runs the build as well as the tests. `npm run build` is `tsc && vite build`,
# so it is the only thing here that catches a type regression — a green test
# suite will not. Required calls this workflow for applicable pull requests;
# the push filter keeps its independent main-branch coverage.
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "README.md"
      - "frontend/**"
      - "run.sh"
      - "templates/captions.html"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Matches the node:26-bookworm-slim base in the Dockerfile, so CI
          # and the image agree on the runtime.
          node-version: "26"
          package-manager-cache: false

      # Fails when package.json and package-lock.json have drifted.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check and build
        run: npm run build
