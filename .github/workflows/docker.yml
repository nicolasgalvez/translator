name: Docker

# Required calls this workflow for applicable pull requests. The push filter
# keeps its independent main-branch coverage without running the image suite for
# unrelated changes.
#
# The frontend stage is built separately so `npm ci` exposes lockfile drift directly.
# The final CUDA runtime is also built and smoke-tested because linting cannot prove
# the locked Python environment or published HTTP service works.
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "run.sh"
      - "uv.lock"
      - "*.py"
      - "transcription/**"
      - "templates/**"
      - "plugins/**"
      - "frontend/**"
      - "scripts/check-docker-context.sh"
      - "scripts/smoke-docker-runtime.sh"
      - "tests/docker-context.Dockerfile"
      - "tests/docker_smoke_app.py"
      - "tests/test_docker_runtime_contract.py"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Verify Docker context exclusions
        run: ./scripts/check-docker-context.sh

      - name: Lint the Dockerfile
        run: docker build --check .

      # Fails when package.json and package-lock.json have drifted, which is the
      # failure this whole workflow exists to catch.
      - name: Build the frontend stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend
          push: false
          load: false

      - name: Validate the compose file
        run: TRANSLATOR_DEVICE="CI ALSA input" docker compose config --quiet

      - name: Build and smoke test the runtime image
        run: ./scripts/smoke-docker-runtime.sh
