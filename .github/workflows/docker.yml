name: Docker

# Deliberately NOT wired into ci.yml. That orchestrator would need a paths-filter
# job to decide whether to build, and such a job bills a runner minute on every
# single PR — more than this check costs on the rare PR that actually touches the
# image. A top-level `paths:` filter is evaluated by GitHub for free.
#
# The frontend stage is built separately so `npm ci` exposes lockfile drift directly.
# The final CUDA runtime is also built and smoke-tested because linting cannot prove
# the locked Python environment or published HTTP service works.
on:
  pull_request:
    paths: &docker_paths
      - ".dockerignore"
      - ".gitignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.py"
      - "transcription/**"
      - "templates/**"
      - "plugins/**"
      - "frontend/**"
      - "scripts/check-docker-context.sh"
      - "scripts/smoke-docker-runtime.sh"
      - "tests/docker-context.Dockerfile"
      - "tests/docker_smoke_app.py"
      - "tests/test_docker_runtime_contract.py"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths: *docker_paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Verify Docker context exclusions
        run: ./scripts/check-docker-context.sh

      - name: Lint the Dockerfile
        run: docker build --check .

      # Fails when package.json and package-lock.json have drifted, which is the
      # failure this whole workflow exists to catch.
      - name: Build the frontend stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        run: TRANSLATOR_DEVICE="CI ALSA input" docker compose config --quiet

      - name: Build and smoke test the runtime image
        run: ./scripts/smoke-docker-runtime.sh
