name: Release

# release-type is "simple": release-please tags the repo and writes CHANGELOG.md
# and version.txt. It does not publish to PyPI or npm — wire a publish job in
# here later if this ever ships as a package.
on:
  push:
    branches: [main]
  # Keeps retries on the trusted default-branch workflow definition. Trigger with
  # `gh api --method POST repos/nicolasgalvez/translator/dispatches \
  #   -f event_type=release-retry`.
  repository_dispatch:
    types: [release-retry]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Only spin up a runner when the push could actually produce a release.
    # release-please rebuilds the release PR from the whole commit range since the
    # last release on every run, so skipping a chore-only push drops nothing — the
    # next releasable push picks those commits up.
    #
    # Matching is deliberately loose. A false positive costs one runner minute; a
    # false negative silently withholds a release, which nobody notices until they
    # go looking for a tag that never appeared.
    #
    # Reads every commit in the push, not just head_commit: a rebase-merge lands
    # several at once and the last one is often the chore. The final clause keeps
    # release-please's own release PR running — that merge is what tags the repo.
    #
    # The repository_dispatch clause must come first and short-circuit: a retry
    # carries no `commits` or `head_commit` in its payload, and a retry is
    # always deliberate, so it is never filtered.
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(join(github.event.commits.*.message, '||'), 'feat') ||
      contains(join(github.event.commits.*.message, '||'), 'fix') ||
      contains(join(github.event.commits.*.message, '||'), 'perf') ||
      contains(join(github.event.commits.*.message, '||'), '!:') ||
      startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # uv.lock records the project's own version, and release-please only knows
      # about pyproject.toml. Without this the release PR ships a lockfile that
      # disagrees with the version it just bumped, and both CI jobs fail on
      # `uv sync --locked` — every release, needing a hand-written lock commit.
      #
      # Candidate dependency metadata is processed without the deploy key. The
      # key is introduced only for the final push, after candidate-derived work
      # has finished.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.release.outputs.pr
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refresh uv.lock for the bumped version
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: trigger required CI for the release"
          else
            git commit -m "chore: refresh uv.lock for the release"
          fi

      - name: Prepare GitHub SSH host keys
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/release-ssh"
          install -d -m 700 "$ssh_directory"
          curl --fail --silent --show-error https://api.github.com/meta \
            | jq -er '.ssh_keys[] | "github.com " + .' \
            > "$ssh_directory/known_hosts"
          test -s "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/known_hosts"

      # This is the only step that receives the environment-scoped deploy key.
      # A deploy-key push emits pull_request_target's synchronize event; a push
      # made with GITHUB_TOKEN would be suppressed by GitHub's recursion guard.
      - name: Push the release update and trigger required CI
        if: steps.release.outputs.pr
        env:
          RELEASE_AUTOMATION_SSH_KEY: ${{ secrets.RELEASE_AUTOMATION_SSH_KEY }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          : "${RELEASE_AUTOMATION_SSH_KEY:?release environment secret is empty}"
          key_path="$RUNNER_TEMP/release-ssh/deploy-key"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_AUTOMATION_SSH_KEY" > "$key_path"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          GIT_SSH_COMMAND="ssh -F /dev/null -i $key_path -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/release-ssh/known_hosts -o StrictHostKeyChecking=yes" \
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
