name: Release

# release-type is "simple": release-please tags the repo and writes CHANGELOG.md
# and version.txt. It does not publish to PyPI or npm — wire a publish job in
# here later if this ever ships as a package.
on:
  push:
    branches: [main]
  # Lets a stuck release be retried. Without it the job below is only reachable
  # from a releasable push, so a run that fails — as one did on a repo-permission
  # error — leaves the release uncut until someone happens to land another
  # feat/fix/perf commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Only spin up a runner when the push could actually produce a release.
    # release-please rebuilds the release PR from the whole commit range since the
    # last release on every run, so skipping a chore-only push drops nothing — the
    # next releasable push picks those commits up.
    #
    # Matching is deliberately loose. A false positive costs one runner minute; a
    # false negative silently withholds a release, which nobody notices until they
    # go looking for a tag that never appeared.
    #
    # Reads every commit in the push, not just head_commit: a rebase-merge lands
    # several at once and the last one is often the chore. The final clause keeps
    # release-please's own release PR running — that merge is what tags the repo.
    #
    # The workflow_dispatch clause must come first and short-circuit: a manual run
    # carries no `commits` or `head_commit` in its payload, and a manual run is
    # always deliberate, so it is never filtered.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.message, '||'), 'feat') ||
      contains(join(github.event.commits.*.message, '||'), 'fix') ||
      contains(join(github.event.commits.*.message, '||'), 'perf') ||
      contains(join(github.event.commits.*.message, '||'), '!:') ||
      startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # uv.lock records the project's own version, and release-please only knows
      # about pyproject.toml. Without this the release PR ships a lockfile that
      # disagrees with the version it just bumped, and both CI jobs fail on
      # `uv sync --locked` — every release, needing a hand-written lock commit.
      #
      # Pushing here cannot loop: this workflow triggers on pushes to main, and
      # this pushes to the release branch.
      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.pr
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refresh uv.lock for the bumped version
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          uv lock
          # Commit only a real change, so a release needing no lock update does
          # not leave an empty commit behind.
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the bumped version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for the release"
          git push
