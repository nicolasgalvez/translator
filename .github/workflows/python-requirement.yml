name: Python Requirement

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "README.md"
      - "pyproject.toml"
      - "tests/test_python_requirement_contract.py"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-python-requirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-requirement:
    name: python-requirement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify the Python requirement
        run: python -m unittest tests/test_python_requirement_contract.py
