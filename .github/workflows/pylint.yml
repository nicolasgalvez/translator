name: Pylint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pylint:
    name: pylint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      # The CPU torch index is declared in pyproject.toml, so the hand-rolled
      # pre-install of a CPU wheel that used to live here is no longer needed —
      # --extra cpu selects it from the lockfile.
      run: uv sync --locked --group dev --extra cpu
    - name: Analysing the code with pylint
      run: |
        uv run pylint $(git ls-files '*.py')
