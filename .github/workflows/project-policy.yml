name: Project policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: project-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install policy dependencies
        run: uv sync --locked --only-group dev

      - name: Run repository checks
        run: uv run --only-group dev pre-commit run --all-files

      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
