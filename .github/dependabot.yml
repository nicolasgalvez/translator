version: 2
updates:
  # uv is its own Dependabot ecosystem, not a pip variant. Leaving this as `pip`
  # after the requirements*.txt files were removed left it matching no manifest,
  # and Dependabot does not warn about that — it just stops opening PRs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
