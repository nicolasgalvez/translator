<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            padding: 0.75rem 1.5rem;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; color: #e94560; }
        .spacer { flex: 1; }
        a.nav-link {
            color: #a0c4ff;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #1a4f8a;
        }
        a.nav-link:hover { background: #1a4f8a; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem; }
        .transcript-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .transcript-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
            text-decoration: none;
            color: #e0e0e0;
            transition: border-color 0.15s;
        }
        .transcript-item:hover { border-color: #e94560; }
        .transcript-label { flex: 1; font-size: 0.95rem; }
        .transcript-count {
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
        }
        .empty {
            text-align: center;
            color: #555;
            margin-top: 4rem;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Transcript History</h1>
        <div class="spacer"></div>
        <a class="nav-link" href="/">Live</a>
        <a class="nav-link" href="/captions">Captions</a>
    </header>
    <div class="container">
        {% if transcripts %}
        <div class="transcript-list">
            {% for t in transcripts %}
            <a class="transcript-item" href="/history/{{ t.filename }}">
                <span class="transcript-label">{{ t.label }}</span>
                <span class="transcript-count">{{ t.count }} segments</span>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty">No transcripts yet. Start translating to create one.</div>
        {% endif %}
    </div>
</body>
</html>
