<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcriber</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #171b22;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 56px;
            padding: 0 1rem;
            border-bottom: 1px solid #343b47;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header h1 { font-size: 0.95rem; font-weight: 650; color: #f6a33d; }
        .status {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: #262d38;
            color: #aab2bf;
        }
        .status.connected { color: #5fc4b8; }
        .spacer { flex: 1; }
        a.nav-link {
            color: #aab2bf;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            border: 1px solid #343b47;
        }
        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 2fr;
            min-height: 0;
        }
        .transcript {
            border-right: 1px solid #343b47;
            background: rgba(38, 45, 56, 0.45);
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .main {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #343b47;
            color: #5fc4b8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .entry {
            padding: 0.75rem;
            border-radius: 6px;
            line-height: 1.5;
            background: #171b22;
            border: 1px solid #343b47;
        }
        .entry .time {
            font-size: 0.7rem;
            color: #aab2bf;
            margin-bottom: 0.25rem;
        }
        .empty-state {
            text-align: center;
            color: #aab2bf;
            margin-top: 3rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Live Transcriber</h1>
        <span class="status" id="status">Disconnected</span>
        <div class="spacer"></div>
        <a class="nav-link" href="/history">History</a>
    </header>
    <div class="layout">
        <aside class="transcript">
            <div class="panel-header">Live Transcript</div>
            <div class="panel-content" id="transcript-panel">
                <div class="empty-state" id="empty">Waiting for audio...</div>
            </div>
        </aside>
        <main class="main">
            <div class="panel-header">Plugin Output</div>
            <div class="panel-content">
                <div class="empty-state">Build the React frontend to enable plugin output.</div>
            </div>
        </main>
    </div>

    <script>
        const panel = document.getElementById('transcript-panel');
        const status = document.getElementById('status');

        function addEntry(event) {
            const empty = document.getElementById('empty');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = 'entry';

            const ts = document.createElement('div');
            ts.className = 'time';
            ts.textContent = event.time;

            const content = document.createElement('div');
            content.textContent = event.text;

            div.appendChild(ts);
            div.appendChild(content);
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws`);

            ws.onopen = () => {
                status.textContent = 'Connected';
                status.className = 'status connected';
            };
            ws.onclose = () => {
                status.textContent = 'Disconnected';
                status.className = 'status';
                setTimeout(connect, 2000);
            };
            ws.onmessage = (message) => {
                const data = JSON.parse(message.data);
                if (data.type === 'transcript') addEntry(data.event);
            };
        }

        connect();
    </script>
</body>
</html>
