<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 0.75rem 1.5rem;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; color: #e94560; }
        .status {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
        }
        .status.connected { background: #1b4332; color: #95d5b2; }
        .status.disconnected { background: #5c1a1a; color: #f4a0a0; }
        .spacer { flex: 1; }
        a.nav-link {
            color: #a0c4ff;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #1a4f8a;
        }
        a.nav-link:hover { background: #1a4f8a; }
        .panels {
            flex: 1;
            display: flex;
            gap: 1px;
            background: #0f3460;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
        }
        .panel-header {
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }
        .panel.es .panel-header { color: #f4a261; }
        .panel.en .panel-header { color: #4cc9f0; }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .entry {
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .panel.es .entry { background: rgba(244, 162, 97, 0.08); border-left: 2px solid #f4a261; }
        .panel.en .entry { background: rgba(76, 201, 240, 0.08); border-left: 2px solid #4cc9f0; }
        .entry .time {
            font-size: 0.7rem;
            color: #666;
            margin-bottom: 0.15rem;
        }
        .empty-state {
            text-align: center;
            color: #444;
            margin-top: 3rem;
            font-size: 0.95rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Live Translator</h1>
        <span class="status disconnected" id="status">Disconnected</span>
        <div class="spacer"></div>
        <a class="nav-link" href="/captions">Captions</a>
        <a class="nav-link" href="/history">History</a>
    </header>
    <div class="panels">
        <div class="panel es">
            <div class="panel-header">Spanish (Original)</div>
            <div class="panel-content" id="es-panel">
                <div class="empty-state" id="es-empty">Waiting for audio...</div>
            </div>
        </div>
        <div class="panel en">
            <div class="panel-header">English (Translation)</div>
            <div class="panel-content" id="en-panel">
                <div class="empty-state" id="en-empty">Waiting for audio...</div>
            </div>
        </div>
    </div>

    <script>
        const esPanel = document.getElementById('es-panel');
        const enPanel = document.getElementById('en-panel');
        const status = document.getElementById('status');

        function addEntry(panel, emptyId, text, time) {
            const empty = document.getElementById(emptyId);
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = 'entry';

            const ts = document.createElement('div');
            ts.className = 'time';
            ts.textContent = time;

            const content = document.createElement('div');
            content.textContent = text;

            div.appendChild(ts);
            div.appendChild(content);
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws`);

            ws.onopen = () => {
                status.textContent = 'Connected';
                status.className = 'status connected';
            };
            ws.onclose = () => {
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
                setTimeout(connect, 2000);
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.es) addEntry(esPanel, 'es-empty', data.es, data.time);
                if (data.en) addEntry(enPanel, 'en-empty', data.en, data.time);
            };
        }

        connect();
    </script>
</body>
</html>
